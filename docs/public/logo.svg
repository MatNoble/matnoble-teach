<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.10" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <style>
    .bg-squircle {
      fill: #FFFFFF;
      stroke: #E2E8F0;
      stroke-width: 3px;
      transition: fill 0.3s ease, stroke 0.3s ease;
    }
    .badge-ring {
      stroke: #FFFFFF;
      transition: stroke 0.3s ease;
    }
    @media (prefers-color-scheme: dark) {
      .bg-squircle {
        fill: #121214;
        stroke: #2D2D35;
      }
      .badge-ring {
        stroke: #121214;
      }
    }
  </style>

  <!-- Base Squircle -->
  <rect class="bg-squircle" x="2" y="2" width="508" height="508" rx="110" />
  
  <!-- Centered Symbol (Scale 3.6, translated to center ~76, 76) -->
  <g transform="translate(76, 76) scale(3.6)" filter="url(#shadow)">
    <!-- Top Triangle (Clay Red) -->
    <polygon points="0,0 100,0 36,48" fill="#E05D52" />
    <!-- Right Triangle (Amber) -->
    <polygon points="100,0 100,100 52,36" fill="#F0B94D" />
    <!-- Bottom Triangle (Sage Teal) -->
    <polygon points="100,100 0,100 64,52" fill="#4AA98C" />
    <!-- Left Triangle (Steel Blue) -->
    <polygon points="0,100 0,0 48,64" fill="#4D84C4" />
  </g>

  <g transform="translate(280, 280)" filter="url(#badgeShadow)">
    <circle cx="85" cy="85" r="85" fill="#1E293B" class="badge-ring" stroke-width="10" />
    <polygon points="85,42 142,68 85,94 28,68" fill="#F8FAFC" />
    <path d="M50 82 L50 104 C50 118 85 126 85 126 C85 126 120 118 120 104 L120 82" fill="#94A3B8" />
    <path d="M128 72 L128 110" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
    <circle cx="128" cy="114" r="4.5" fill="#F59E0B" />
  </g>
</svg>